<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 260px;
    padding: 14px;
    margin: 0;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 10px;
    color: #555;
    font-weight: 600;
  }
  label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 0;
    cursor: pointer;
  }
  .note {
    font-size: 11px;
    color: #888;
    margin-top: 10px;
    line-height: 1.5;
  }
  input[type="checkbox"] {
    width: 34px;
    height: 20px;
  }
</style>
</head>
<body>
  <h1>X Name/ID Hider Settings</h1>
  <label>
    Hide author names/IDs in timeline
    <input type="checkbox" id="toggle-timeline">
  </label>
  <div class="note">
    Names/IDs in the account switcher menu are always masked.
  </div>
  <script src="popup.js"></script>
</body>
</html>
